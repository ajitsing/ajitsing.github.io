{% if site.manual_ads %}
{% assign grid_slot = include.slot | default: "9096626276" %}
{% assign grid_label = include.label | default: "Multiplex Fallback" %}
<div class="post-mid-ad post-mid-ad--multiplex">
  <div class="post-mid-ad__loading" aria-live="polite">
    <span class="post-mid-ad__spinner" aria-hidden="true"></span>
    Loading
  </div>
  <div class="post-mid-ad__slot">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-format="autorelaxed"
         data-ad-client="ca-pub-2886086145980317"
         data-ad-slot="{{ grid_slot }}"
         data-matched-content-ui-type="image_stacked,image_card_stacked"
         data-matched-content-columns-num="1,4"
         data-matched-content-rows-num="4,2"></ins>
  </div>
  <div class="post-mid-ad__substack" aria-hidden="true">
    {% include ads/in-article-subscribe.html label=grid_label %}
  </div>
  <script>
  (function () {
    var wrap = document.currentScript.parentNode;
    var slot = wrap.querySelector('.post-mid-ad__slot');
    var ins = wrap.querySelector('ins.adsbygoogle');
    var fallback = wrap.querySelector('.post-mid-ad__substack');
    if (!ins) return;

    var settled = false;

    function removeFallback() {
      if (fallback && fallback.parentNode) fallback.remove();
      fallback = null;
    }

    function adBlocked() {
      try {
        var s = window.getComputedStyle(ins);
        if (s.display === 'none' || s.visibility === 'hidden') return true;
      } catch (e) {}

      try {
        var bait = document.getElementById('ad-blocker-bait');
        if (!bait) return false;
        var cs = window.getComputedStyle(bait);
        return cs.display === 'none' || cs.visibility === 'hidden';
      } catch (e) {
        return false;
      }
    }

    function hideLoading() {
      var loading = wrap.querySelector('.post-mid-ad__loading');
      if (loading) loading.remove();
    }

    function keepAd() {
      if (settled) return;
      settled = true;
      hideLoading();
      removeFallback();
      wrap.classList.add('post-mid-ad--filled');
      wrap.style.overflow = 'visible';
    }

    function showFallback() {
      if (settled) return;
      settled = true;
      hideLoading();

      if (slot) slot.remove();
      if (!fallback) return;

      wrap.classList.add('post-mid-ad--substack');
      fallback.removeAttribute('aria-hidden');
    }

    function adRendered() {
      return ins.getAttribute('data-ad-status') === 'filled';
    }

    function resolve(obs) {
      var status = ins.getAttribute('data-ad-status');
      if (status === 'unfilled') { obs.disconnect(); showFallback(); return true; }
      if (status === 'filled') { obs.disconnect(); keepAd(); return true; }
      return false;
    }

    function requestAd() {
      if (settled) return;

      requestAnimationFrame(function () {
        if (settled) return;

        if (!(wrap.clientWidth > 0)) {
          settled = true;
          hideLoading();
          removeFallback();
          wrap.style.display = 'none';
          return;
        }

        if (adBlocked()) { showFallback(); return; }

        try { (adsbygoogle = window.adsbygoogle || []).push({}); }
        catch (e) { showFallback(); return; }

        if (adBlocked()) { showFallback(); return; }

        var obs = new MutationObserver(function () { resolve(obs); });
        obs.observe(ins, { attributes: true, attributeFilter: ['data-ad-status'] });

        setTimeout(function () {
          if (settled) return;
          if (resolve(obs)) return;
          obs.disconnect();
          if (adRendered()) keepAd(); else showFallback();
        }, 3500);
      });
    }

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) { io.disconnect(); requestAd(); }
      }, { rootMargin: '200px 0px' });
      io.observe(wrap);
    } else {
      requestAd();
    }
  })();
  </script>
</div>
{% endif %}
