{% assign hero_skip_individual_tool = false %}
{% if page.path != 'tools/index.html' %}
  {% if page.path contains 'tools/' %}
    {% assign hero_skip_individual_tool = true %}
  {% endif %}
{% endif %}
{% if site.manual_ads and hero_skip_individual_tool == false %}
<style>
  .hero-banner {
    display: none;
    position: relative;
    width: 100%;
    padding: 12px 0;
    background-color: #e8eaed;
    contain: layout;
  }
  .hero-banner__inner {
    width: 970px;
    margin: 0 auto;
  }
  .hero-banner__card {
    width: 970px;
    height: 90px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #dadce0;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-banner__unit {
    display: block;
    width: 970px;
    height: 90px;
  }
  @media (min-width: 992px) {
    .hero-banner { display: block; }
  }
</style>
<aside class="hero-banner" aria-label="Sponsored placement">
  <div class="hero-banner__inner">
    <div class="hero-banner__card">
      <ins class="adsbygoogle hero-banner__unit"
           style="display:inline-block;width:970px;height:90px"
           data-ad-client="ca-pub-2886086145980317"
           data-ad-slot="1526599965"></ins>
    </div>
  </div>
  <script>
    (function () {
      if (!window.matchMedia || !window.matchMedia('(min-width: 992px)').matches) return;
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return;
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    })();
  </script>
</aside>
{% endif %}
