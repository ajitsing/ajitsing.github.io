<div class="post-mid-ad{% if include.extra_class %} {{ include.extra_class }}{% endif %}">
  <div class="ad-label"><span class="ad-label-text">Advertisement</span></div>
  <div class="post-mid-ad__card">
    <ins class="adsbygoogle post-mid-ad__unit"
         style="display:block; text-align:center; min-height:250px;"
         data-ad-client="ca-pub-2886086145980317"
         data-ad-slot="{{ include.slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
  <script>
  (function () {
    var wrap = document.currentScript.closest('.post-mid-ad');
    if (!wrap) return;
    var ins = wrap.querySelector('ins.adsbygoogle');
    if (!ins) return;

    var requested = false;
    function requestAd() {
      if (requested) return;
      requestAnimationFrame(function () {
        if (requested) return;
        if (!(wrap.clientWidth > 0)) return;
        requested = true;
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
      });
    }

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) { io.disconnect(); requestAd(); }
      }, { rootMargin: '1000px 0px' });
      io.observe(wrap);
    } else {
      requestAd();
    }
  })();
  </script>
</div>
