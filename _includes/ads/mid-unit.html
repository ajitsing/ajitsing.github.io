<div class="post-mid-ad{% if include.extra_class %} {{ include.extra_class }}{% endif %}">
  <div class="post-mid-ad__card">
    <ins class="adsbygoogle post-mid-ad__unit"
         style="display:block;width:100%;height:250px"
         data-ad-client="ca-pub-2886086145980317"
         data-ad-slot="{{ include.slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
  <script>
  (function () {
    var wrap = document.currentScript.closest('.post-mid-ad');
    if (!wrap) return;
    if (wrap.classList.contains('post-mid-ad--display') &&
        window.matchMedia && window.matchMedia('(min-width: 769px)').matches) {
      return;
    }
    if (!(wrap.offsetWidth > 0)) {
      wrap.remove();
      return;
    }

    function requestAd() {
      try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
    }

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) { io.disconnect(); requestAd(); }
      }, { rootMargin: '1500px 0px' });
      io.observe(wrap);
    } else {
      requestAd();
    }
  })();
  </script>
</div>
