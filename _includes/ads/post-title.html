{% if site.manual_ads %}
<style>
  .post-header-row:has(.post-title-ad) {
    display: grid;
    grid-template-columns: 1fr;
    width: 100%;
    align-items: start;
  }
  .post-title-ad {
    display: none;
    width: 342px;
    margin: 0;
    padding: 0;
  }
  .post-title-ad__unit {
    display: block;
    width: 300px;
    height: 250px;
    margin-left: auto;
  }
  @media (min-width: 1200px) {
    .post-header-row:has(.post-title-ad) {
      grid-template-columns: minmax(0, 1fr) 342px;
      gap: 3rem;
    }
    .post-title-ad {
      display: block;
    }
  }
  @media (min-width: 1200px) and (max-width: 1399px) {
    .post-header-row:has(.post-title-ad) { gap: 2rem; }
  }
  @media (min-width: 1400px) {
    .post-header-row:has(.post-title-ad) { gap: 3.5rem; }
  }
</style>
<aside class="post-title-ad" aria-label="Sponsored placement">
  <ins class="adsbygoogle post-title-ad__unit"
       style="display:inline-block;width:300px;height:250px"
       data-ad-client="ca-pub-2886086145980317"
       data-ad-slot="7438923730"></ins>
  <script>
    (function () {
      if (!window.matchMedia || !window.matchMedia('(min-width: 1200px)').matches) return;
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return;
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    })();
  </script>
</aside>
{% endif %}
