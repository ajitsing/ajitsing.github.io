{% if site.manual_ads %}
<style>
  .tool-top-ad {
    margin: 24px 0 36px;
    padding: 0 4px;
    contain: layout;
    overflow-anchor: none;
  }
  .tool-top-ad__card {
    width: 100%;
    height: 280px;
    min-height: 280px;
    margin: 0 auto;
    box-sizing: border-box;
    background: #faf8f5;
    border: 2px solid #e7e0d5;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-top-ad__unit {
    display: block;
    width: 100%;
    height: 280px;
    min-height: 280px;
  }
  @media (max-width: 768px) {
    .tool-top-ad {
      margin: 20px 0 28px;
    }
  }
</style>
<aside class="tool-top-ad" aria-label="Sponsored placement">
  <div class="tool-top-ad__card">
    <ins class="adsbygoogle tool-top-ad__unit"
         style="display:block;width:100%;height:280px"
         data-ad-client="ca-pub-2886086145980317"
         data-ad-slot="2413953100"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
  <script>
    (function () {
      var wrap = document.currentScript.closest('.tool-top-ad');
      if (!wrap) return;
      if (!(wrap.offsetWidth > 0)) {
        var empty = wrap.querySelector('ins.adsbygoogle');
        if (empty) empty.remove();
        return;
      }

      var startY = window.scrollY;
      var until = Date.now() + 4000;

      function restoreTopIfAdStoleFocus() {
        if (Date.now() > until) return;
        if (startY > 16) return;
        if (window.scrollY > 16) window.scrollTo(0, startY);
      }

      wrap.addEventListener('focusin', function (e) {
        if (Date.now() > until) return;
        if (e.target && typeof e.target.blur === 'function') e.target.blur();
        restoreTopIfAdStoleFocus();
      }, true);

      new MutationObserver(function () {
        var iframe = wrap.querySelector('iframe');
        if (iframe) iframe.setAttribute('tabindex', '-1');
      }).observe(wrap, { childList: true, subtree: true });

      try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
    })();
  </script>
</aside>
{% endif %}
