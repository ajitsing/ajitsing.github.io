{% if site.manual_ads %}
<style>
  .tool-top-ad {
    margin: 24px 0 36px;
    padding: 0 4px;
    contain: layout;
  }
  .tool-top-ad__card {
    width: 100%;
    height: 200px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #dadce0;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-top-ad__unit {
    display: block;
    width: 100%;
    height: 200px;
  }
  @media (max-width: 768px) {
    .tool-top-ad {
      margin: 20px 0 28px;
    }
  }
</style>
<aside class="tool-top-ad" aria-label="Sponsored placement">
  <div class="tool-top-ad__card">
    <ins class="adsbygoogle tool-top-ad__unit"
         style="display:block;width:100%;height:200px"
         data-ad-client="ca-pub-2886086145980317"
         data-ad-slot="2413953100"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
  <script>
    (function () {
      var wrap = document.currentScript.closest('.tool-top-ad');
      if (wrap && wrap.offsetWidth > 0) {
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
      } else if (wrap) {
        var ins = wrap.querySelector('ins.adsbygoogle');
        if (ins) ins.remove();
      }
    })();
  </script>
</aside>
{% endif %}
