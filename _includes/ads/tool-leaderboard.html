{% if site.manual_ads and include.slot %}
<style>
  .tool-leaderboard-ad {
    margin: 24px 0 36px;
    padding: 0 4px;
    contain: layout;
    overflow-anchor: none;
  }
  .tool-leaderboard-ad__card {
    width: 100%;
    height: 90px;
    min-height: 90px;
    margin: 0 auto;
    box-sizing: content-box;
    background: #faf8f5;
    border: 2px solid #e7e0d5;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-leaderboard-ad__unit {
    display: block;
    width: 100%;
    height: 90px;
    min-height: 90px;
  }
  @media (max-width: 768px) {
    .tool-leaderboard-ad {
      margin: 20px 0 28px;
    }
  }
</style>
<aside class="tool-leaderboard-ad" aria-label="Sponsored placement">
  <div class="tool-leaderboard-ad__card">
    <ins class="adsbygoogle tool-leaderboard-ad__unit"
         style="display:block;width:100%;height:90px"
         data-ad-client="ca-pub-2886086145980317"
         data-ad-slot="{{ include.slot }}"
         data-ad-format="horizontal"></ins>
  </div>
  <script>
    (function () {
      var wrap = document.currentScript.closest('.tool-leaderboard-ad');
      if (!wrap) return;
      if (!(wrap.offsetWidth > 0)) {
        wrap.remove();
        return;
      }
      try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
    })();
  </script>
</aside>
{% endif %}
