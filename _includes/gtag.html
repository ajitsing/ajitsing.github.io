{% if site.gtag %}
<!-- Global site tag (gtag.js) - deferred until after load + idle -->
<script>
  if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.gtag }}');

    function loadGtag() {
      if (window.__gtagLoaded) return;
      window.__gtagLoaded = true;
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.gtag }}';
      document.head.appendChild(script);
    }

    function scheduleGtag() {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGtag, { timeout: 3500 });
      } else {
        setTimeout(loadGtag, 2000);
      }
    }

    if (document.readyState === 'complete') {
      scheduleGtag();
    } else {
      window.addEventListener('load', scheduleGtag);
    }
  }
</script>
{% endif %}
