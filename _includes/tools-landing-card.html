{%- assign tool = include.tool -%}
{%- assign search_blob = tool.title | append: ' ' | append: tool.description | append: ' ' | append: tool.keywords | append: ' ' | append: tool.category | downcase -%}
<a href="{{ tool.link | relative_url }}"
   class="tool-card"
   data-category="{{ tool.category }}"
   data-search="{{ search_blob | escape }}"
   onclick="if (typeof gtag === 'function') { gtag('event', 'click', {'event_category': 'Tools', 'event_label': '{{ tool.title | escape }}'}); }">
  <div class="tool-icon" aria-hidden="true">
    <i class="{{ tool.icon }}"></i>
  </div>
  <div class="tool-info">
    <h2 class="tool-title">{{ tool.title }}</h2>
    <p class="tool-description">{{ tool.description }}</p>
  </div>
</a>
