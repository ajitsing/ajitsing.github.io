{% assign default_length = include.default_length | default: 16 %}
<div id="password-generator-app" class="pg-app" data-default-length="{{ default_length }}">
  <section class="pg-generator-main">
    <div class="pg-output-section">
      <div class="section-header">
        <label><i class="fas fa-key"></i> Your password</label>
        <div class="pg-output-actions">
          <button type="button" id="pg-copy-btn" class="btn-action" title="Copy to clipboard">
            <i class="fas fa-copy"></i>
            <span class="pg-btn-label">Copy</span>
          </button>
          <button type="button" id="pg-regen-btn" class="btn-action" title="Generate a new password">
            <i class="fas fa-sync-alt"></i>
            <span class="pg-btn-label">Regenerate</span>
          </button>
        </div>
      </div>

      <div class="pg-output-wrapper">
        <div id="pg-output" class="pg-output-text" aria-live="polite"></div>
      </div>

      <div class="pg-strength" id="pg-strength" aria-label="Password strength">
        <div class="pg-strength-bar">
          <div class="pg-strength-fill" id="pg-strength-fill"></div>
        </div>
        <span class="pg-strength-label" id="pg-strength-label">-</span>
      </div>

      {% if site.manual_ads %}
      <aside class="pg-output-ad" aria-label="Sponsored placement">
        <ins class="adsbygoogle pg-output-ad__unit"
             style="display:inline-block;width:300px;height:250px"
             data-ad-client="ca-pub-2886086145980317"
             data-ad-slot="7438923730"></ins>
        <script>
          (function () {
            var wrap = document.currentScript.closest('.pg-output-ad');
            if (!wrap) return;
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
              wrap.remove();
              return;
            }
            requestAnimationFrame(function () {
              if (wrap.clientWidth > 0) {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
              } else {
                wrap.remove();
              }
            });
          })();
        </script>
      </aside>
      {% endif %}
    </div>

    <div class="pg-controls-section">
      <div class="section-header">
        <label><i class="fas fa-sliders-h"></i> Options</label>
      </div>

      <div class="pg-mode-tabs" role="tablist" aria-label="Generator mode">
        <button type="button" class="pg-mode-btn active" data-mode="characters" role="tab" aria-selected="true">
          <i class="fas fa-font"></i>
          <span>Characters</span>
        </button>
        <button type="button" class="pg-mode-btn" data-mode="words" role="tab" aria-selected="false">
          <i class="fas fa-book"></i>
          <span>Words</span>
        </button>
      </div>

      <div id="pg-char-panel" class="pg-panel">
        <div class="pg-length-row">
          <div class="pg-length-header">
            <label for="pg-length">Length</label>
            <span class="pg-length-value" id="pg-length-value">{{ default_length }}</span>
          </div>
          <input
            type="range"
            id="pg-length"
            min="4"
            max="64"
            value="{{ default_length }}"
            aria-valuemin="4"
            aria-valuemax="64"
            aria-valuenow="{{ default_length }}"
          >
          <div class="pg-presets" role="group" aria-label="Length presets">
            <button type="button" class="pg-preset-btn" data-length="8">8</button>
            <button type="button" class="pg-preset-btn" data-length="12">12</button>
            <button type="button" class="pg-preset-btn" data-length="16">16</button>
            <button type="button" class="pg-preset-btn" data-length="24">24</button>
            <button type="button" class="pg-preset-btn" data-length="32">32</button>
          </div>
        </div>

        <div class="pg-charset-group" role="group" aria-label="Character sets">
          <label class="pg-check">
            <input type="checkbox" id="pg-upper" checked>
            <span>Uppercase <code>A-Z</code></span>
          </label>
          <label class="pg-check">
            <input type="checkbox" id="pg-lower" checked>
            <span>Lowercase <code>a-z</code></span>
          </label>
          <label class="pg-check">
            <input type="checkbox" id="pg-numbers" checked>
            <span>Numbers <code>0-9</code></span>
          </label>
          <label class="pg-check">
            <input type="checkbox" id="pg-symbols" checked>
            <span>Symbols <code>!@#$…</code></span>
          </label>
          <label class="pg-check">
            <input type="checkbox" id="pg-spaces">
            <span>Spaces</span>
          </label>
          <label class="pg-check">
            <input type="checkbox" id="pg-ambiguous" checked>
            <span>Exclude ambiguous <code>0 O l 1 I</code></span>
          </label>
        </div>
      </div>

      <div id="pg-word-panel" class="pg-panel hidden">
        <div class="pg-length-row">
          <div class="pg-length-header">
            <label for="pg-word-count">Words</label>
            <span class="pg-length-value" id="pg-word-count-value">6</span>
          </div>
          <input
            type="range"
            id="pg-word-count"
            min="3"
            max="10"
            value="6"
            aria-valuemin="3"
            aria-valuemax="10"
            aria-valuenow="6"
          >
          <div class="pg-presets" role="group" aria-label="Word count presets">
            <button type="button" class="pg-word-preset-btn" data-words="4">4</button>
            <button type="button" class="pg-word-preset-btn" data-words="5">5</button>
            <button type="button" class="pg-word-preset-btn active" data-words="6">6</button>
            <button type="button" class="pg-word-preset-btn" data-words="7">7</button>
          </div>
        </div>

        <div class="pg-sep-row">
          <span class="pg-sep-label">Separator</span>
          <div class="pg-sep-group" role="group" aria-label="Word separator">
            <button type="button" class="pg-sep-btn active" data-sep="-">Hyphen</button>
            <button type="button" class="pg-sep-btn" data-sep=" ">Space</button>
            <button type="button" class="pg-sep-btn" data-sep="">None</button>
          </div>
        </div>

        <div class="pg-charset-group">
          <label class="pg-check">
            <input type="checkbox" id="pg-capitalize">
            <span>Capitalize words</span>
          </label>
          <label class="pg-check">
            <input type="checkbox" id="pg-add-number">
            <span>Add a number</span>
          </label>
        </div>
      </div>
    </div>
  </section>
</div>
